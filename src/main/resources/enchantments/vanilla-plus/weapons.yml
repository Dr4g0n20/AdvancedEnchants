# Vanilla+ melee and bow enchantments implemented for the Bukkit 1.12.2 combat API.
# Trident-only mechanics are unavailable because tridents were added after 1.12.2.

category: weapons
enchantments:

  criticals:
    display-name: Criticals
    maximum-level: 3
    description: Increases damage dealt by a vanilla critical hit.
    rarity: UNASSIGNED
    applicable-items: [WOOD_SWORD, STONE_SWORD, IRON_SWORD, GOLD_SWORD, DIAMOND_SWORD]
    incompatible-with: []
    activation: {type: PASSIVE, chance: 100.0, cooldown-seconds: 0}
    effects:
      bonus-critical-damage-per-level: 0.10

  first_strike:
    display-name: First Strike
    maximum-level: 3
    description: Deals bonus damage when striking an enemy at full health.
    rarity: UNASSIGNED
    applicable-items: [WOOD_SWORD, STONE_SWORD, IRON_SWORD, GOLD_SWORD, DIAMOND_SWORD, WOOD_AXE, STONE_AXE, IRON_AXE, GOLD_AXE, DIAMOND_AXE]
    incompatible-with: []
    activation: {type: PASSIVE, chance: 100.0, cooldown-seconds: 0}
    effects:
      bonus-damage-per-level: 0.15
      requires-target-full-health: true

  finishing:
    display-name: Finishing
    maximum-level: 3
    description: Deals bonus damage to enemies below 30 percent health.
    rarity: UNASSIGNED
    applicable-items: [WOOD_SWORD, STONE_SWORD, IRON_SWORD, GOLD_SWORD, DIAMOND_SWORD, WOOD_AXE, STONE_AXE, IRON_AXE, GOLD_AXE, DIAMOND_AXE]
    incompatible-with: []
    activation: {type: PASSIVE, chance: 100.0, cooldown-seconds: 0}
    effects:
      bonus-damage-per-level: 0.15
      target-health-threshold: 0.30

  blackout:
    display-name: Blackout
    maximum-level: 5
    description: Has a chance to briefly blind the enemy on a successful melee hit.
    rarity: UNASSIGNED
    applicable-items: [WOOD_SWORD, STONE_SWORD, IRON_SWORD, GOLD_SWORD, DIAMOND_SWORD]
    incompatible-with: []
    activation: {type: PASSIVE, chance: 100.0, cooldown-seconds: 0}
    effects:
      potion-effect: BLINDNESS
      duration-ticks-per-level: 20
      chance-per-level: 0.10

  blaze_reaper:
