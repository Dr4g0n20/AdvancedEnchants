# Vanilla+ weapon enchantments adapted for Minecraft 1.12.2.
#
# Rarity is deliberately UNASSIGNED for this first catalogue pass. The six-tier
# rarity distribution will be set after the complete catalogue is reviewed.
# Chance/cooldown are safe defaults only; activation balancing is a later pass.
#
# "effects" is reserved for structured effect parameters. The actual effect
# handlers are being implemented separately and are not active yet.

