general:
  debug: false
  max-enchantments: 10

combat-logging:
  enabled: true
  tag-duration-seconds: 15

anvil:
  enabled: true
  remove-prior-work-penalty: true
  maximum-cost: 10000
  cost-by-resulting-levels: true
  free-renaming: true
  free-repairing: true

feedback:
  # none, reduced, or full
  default-mode: none

enchantments:
  load-vanilla-plus: true
\n\n# Custom enchantment acquisition.
# Every successful table result is supplemented to at least 2 total enchantments.
# The highest table option can instead target 4 total enchantments.
acquisition:
  enchanting-table:
    enabled: true
    minimum-total-enchantments: 2
    maximum-option-cost: 3
    four-enchantment-target: 4
    four-enchantment-chance: 35.0
